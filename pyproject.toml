[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrank-polite-scraper"
version = "1.0.0"
description = "A polite, validated Books to Scrape catalogue scraper for FlyRank Backend Assignment 5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FlyRank assignment submission" }]
dependencies = []

[project.scripts]
polite-scraper = "polite_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polite_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]